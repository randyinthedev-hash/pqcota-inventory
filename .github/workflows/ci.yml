name: ci

# 이 리포의 검사를 사람이 기억하지 않아도 걸리게 한다. 리포 사이에 걸친 검사(import 방향·게이트 배선·문서 링크의
# 교차 확인)는 통합 리포 pqcota의 ci.yml이 다섯 리포를 함께 받아 잰다.
# 아래 cross-stage 작업이 그 통합 검사를 이 리포의 커밋으로 부른다. 단계 하나만 바뀌어도 다섯을 함께 잰다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # Postgres 케이스가 여기서 돌게 한다. 조직 격리는 **한 테이블을 공유하는 쪽에서만** 잴 수 있어,
    # 인메모리 케이스가 통과해도 증명되지 않는다. DSN이 없으면 그 케이스들이 표시 없이 스킵되고
    # 격리는 확인되지 않은 채 초록이 된다.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pqcota
          POSTGRES_PASSWORD: pqcota
          POSTGRES_DB: pqcota
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 형제 리포를 이 리포와 **나란히** 받는다 — go.mod가 replace로 ../ 를 읽는 배치다.
      - uses: actions/checkout@v7
        with:
          path: pqcota-inventory
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: randyinthedev-hash/pqcota-common
          path: pqcota-common
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: pqcota-inventory/go.mod
          cache: true
          cache-dependency-path: pqcota-inventory/go.sum

      - name: fmt / vet
        working-directory: pqcota-inventory
        run: |
          make fmt-check
          make vet

      - name: build
        working-directory: pqcota-inventory
        run: make build

      # integration은 환경이 없으면 스스로 스킵한다 — 스킵은 통과가 아니므로
      # 무엇이 건너뛰었는지 로그에 남긴다. `-v` 없이 돌리면 스킵이 아예 찍히지 않는다.
      # 출력은 `-v`로 받아 두고 요약만 낸다.
      - name: test
        working-directory: pqcota-inventory
        env:
          PQCOTA_TEST_DSN: postgres://pqcota:pqcota@localhost:5432/pqcota?sslmode=disable
        run: |
          set +e
          go test ./... -count=1 -v > /tmp/test.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            # 실패하면 요약만 봐서는 원인을 못 짚는다. 통째로 낸다.
            cat /tmp/test.log
          else
            grep -E '^ok  ' /tmp/test.log
          fi
          echo "── 건너뛴 케이스 (스킵은 통과가 아니다)"
          if grep -qE '^ *--- SKIP' /tmp/test.log; then
            grep -E '^ *--- SKIP' /tmp/test.log | sed 's/^ *//'
          else
            echo "  없다"
          fi
          exit $status

  # 통합 리포의 검사(import 방향·게이트 배선·문서 링크·단계 사이 테스트)를 이 커밋으로 돌린다.
  # 나머지 넷은 main이다. 이 작업이 빨개지면 이 변경이 다른 단계나 통합 검사를 깨뜨린다는 뜻이다.
  cross-stage:
    uses: randyinthedev-hash/pqcota/.github/workflows/ci.yml@main
    with:
      caller: pqcota-inventory
      ref: ${{ github.sha }}
